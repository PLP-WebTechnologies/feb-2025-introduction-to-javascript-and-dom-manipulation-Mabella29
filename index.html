<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
    <link rel="stylesheet" href="/feb-2025-introduction-to-javascript-and-dom-manipulation-Mabella29/style.css">
</head>
<body>
    <header>
        <h1 id="main-heading">DOM Manipulation Demo</h1>
    </header>
    
    <main>
        <section class="content-section">
            <p id="changeable-text">This text will change when you click the button below.</p>
            <button id="text-changer">Change Text</button>
        </section>
        
        <section class="content-section">
            <div id="style-demo" class="box">This box will change color and size.</div>
            <button id="style-changer">Change Styles</button>
        </section>
        
        <section class="content-section">
            <div id="element-container">
                <p>Existing element</p>
            </div>
            <button id="toggle-element">Toggle Element</button>
        </section>
    </main>
    
    
    <script src="script.js"></script>
</body>
</html>
